<!DOCTYPE html>
<html>

<head>
    <script src="../dist-browser/index.iife.js"></script>

</head>

<body>

    <script>
        const graph = {
            "start": "greeting",
            "nodes": {
                "greeting": {
                    "type": "speech",
                    "values": {
                        "character": "Guard",
                        "text": "Hello!"
                    },
                    "next": "ask"
                },
                "ask": {
                    "type": "speech",
                    "values": {
                        "character": "Guard",
                        "text": "What do you want?"
                    },
                    "options": [
                        { "values": { "text": "I seek adventure." }, "next": "adventure" },
                        { "values": { "text": "I want to trade." }, "next": "trade" },
                        { "values": { "text": "Nothing, goodbye." }, "next": "end" }
                    ]
                },
                "trade": {
                    "type": "trigger",
                    "subject": "trade",
                    "next": "ask"
                },
                "adventure": {
                    "type": "speech",
                    "values": {
                        "character": "Guard",
                        "text": "Then go east, brave soul!"
                    },
                    "next": "end"
                },
                "end": { "id": "end", "type": "end" }
            }
        }

        const player = new ImscScript.ImscScriptPlayer(graph, {
            events: {
                onSpeech: ({ speech }) => {
                    console.log("Speech bubble", speech)
                    if (speech.options.length > 0) {
                        let choice = -1
                        while (choice < 0 || choice >= speech.options.length || isNaN(choice)) {
                            choice = parseInt(
                                prompt([
                                    `${speech.character}:`,
                                    speech.text,
                                    '',
                                    ...speech.options.map((opt, index) => {
                                        return `${index + 1}. ${opt.text}`
                                    }),
                                ].join("\n"))
                            ) - 1
                        }
                        player.continue(choice)
                    }
                    else {
                        alert([
                            `${speech.character}:`,
                            speech.text
                        ].join("\n"))
                        player.continue()
                    }
                },
                onChoice: ({ optionIndex }) => {
                    console.log(`Player chosen option ${optionIndex}`);
                },
                onAction: async ({ type, subject, inputs }) => {
                    console.log(`Action: ${type} - ${subject}`, inputs);
                    if (subject === 'trade') {
                        alert('Here is trading screen...')
                    }
                    return { outputs: { success: true } };
                },
                onEnd: () => {
                    console.log('Dialog finished');
                }
            }
        });

        player.play();
    </script>
</body>

</html>
